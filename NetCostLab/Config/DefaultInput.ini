; P05 NetCostLab - input configuration.
; Only the two keys Epic's 5.8 TP_Blank template sets for Enhanced Input (Templates/TP_Blank/Config/DefaultInput.ini:79-80).
; Without them the engine creates the classic UPlayerInput and the (default-enabled) Enhanced Input plugin warns at
; startup that its local-player subsystem has "no valid PlayerInput object" (EnhancedInputSubsystems.cpp:115-119).
; Our clients read no input; this only keeps their logs free of that warning.

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

; P05 NetCostLab - engine configuration.
; The keys marked "restated" are engine defaults written out on purpose, so a later change to them shows in a diff.

[/Script/EngineSettings.GameMapsSettings]
; An engine map with a floor and lights; no map has to be authored. Everything else is spawned by code (from step S1).
; ServerDefaultMap is the map a dedicated server opens when no map is given on its command line.
GameDefaultMap=/Engine/Maps/Templates/Template_Default
ServerDefaultMap=/Engine/Maps/Templates/Template_Default
EditorStartupMap=/Engine/Maps/Templates/Template_Default

[/Script/Engine.Engine]
; Restated: no frame-rate smoothing and no fixed frame-rate cap, so frame times reflect real work.
bSmoothFrameRate=False
bUseFixedFrameRate=False

[SystemSettings]
; Restated: VSync off, so a client never waits for a display.
r.VSync=0
; Required by Iris: replicated actors must use registered sub-object lists. Without it the Iris bridge raises a handled
; ensure on server and clients (EngineReplicationBridge.cpp:234; seen in probe P2-1 and check F4). The default is false
; (ActorComponent.cpp:115-117) and every actor copies it in its constructor (Actor.cpp:292), so it must be set here, at
; start-up, not on the command line of one run. It is set for ALL five configurations, so the workload is identical.
net.SubObjects.DefaultUseSubObjectReplicationList=1

[/Script/OnlineSubsystemUtils.IpNetDriver]
; Restated: the dedicated server ticks at 30 Hz (GameEngine.cpp:1719-1745 reads this; BaseEngine.ini:1867 sets it).
NetServerMaxTickRate=30

[/Script/Engine.RendererSettings]
; From Epic's 5.8 TP_Blank template: standard modern defaults, not benchmark choices (nothing is rendered in a run).
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
